name: Lint
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install flake8 flake8-bandit
      - run: flake8 src/
