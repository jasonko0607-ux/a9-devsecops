receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  debug:
    verbosity: detailed
  file/traces:
    path: /out/traces.json
  file/logs:
    path: /out/logs.json
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file/logs]
