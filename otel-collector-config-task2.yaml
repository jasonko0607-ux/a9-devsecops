receivers:            # 收：從哪裡接資料
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # 必須 0.0.0.0，容器外才連得到
      http:
        endpoint: 0.0.0.0:4318
processors:           # 處理：打包成批再送
  batch:
exporters:            # 送出：輸出到哪裡
  debug:
    verbosity: detailed          # 印在 collector 的畫面
  file:
    path: /out/telemetry.json    # 容器內的路徑
service:
  pipelines:          # 把三個階段串起來
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, file]
